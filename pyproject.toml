[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-eco2ai-plugin"
version = "1.0.0"
description = "HuggingFace Trainer plugin for tracking carbon emissions during ML training"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Daniel Schmidt", email = "danschmidt88@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = [
    "huggingface", "transformers", "carbon", "eco2ai", "sustainability",
    "green-ai", "emissions", "mlops", "carbon-tracking"
]
requires-python = ">=3.10"
# Zero hard dependencies — works out of the box
# Install transformers separately for real HF Trainer integration
dependencies = []

[project.optional-dependencies]
transformers = ["transformers>=4.57.6"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/danieleschmidt/hf-eco2ai-plugin"
Repository = "https://github.com/danieleschmidt/hf-eco2ai-plugin"
"Bug Tracker" = "https://github.com/danieleschmidt/hf-eco2ai-plugin/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hf_eco2ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-v"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests that require GPU",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
